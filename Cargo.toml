[package]
name = "componentize-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool for targeting the WebAssembly Component Model using Python"

[lib]
name = "componentize_py"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "componentize-py"
required-features = ["embedded-runtime"]

[features]
default = ["embedded-runtime"]
# Builds CPython and the runtime into the crate.  Preparing assets and
# `componentize` need it; reading and assembling prepared assets do not.
embedded-runtime = [
    "dep:bincode",
    "dep:cap-std",
    "dep:clap",
    "dep:heck",
    "dep:im-rc",
    "dep:once_cell",
    "dep:pretty_env_logger",
    "dep:semver",
    "dep:tokio",
    "dep:wasm-pkg-client",
    "dep:wasmtime-wasi",
    "dep:wit-bindgen-core",
    "dep:wit-dylib",
    "dep:wit-parser",
]
pyo3 = ["dep:pyo3", "embedded-runtime"]

[dependencies]
anyhow = { version = "1.0.91", features = ["backtrace"] }
clap = { version = "4.5.20", features = ["derive"], optional = true }
tar = "0.4.42"
tempfile = "3.13.0"
zstd = "0.13.2"
wasm-encoder = { version = "0.258.0", features = ["wasmparser"] }
wit-dylib = { version = "0.258.0", optional = true }
wit-parser = { version = "0.258.0", optional = true }
wit-component = "0.258.0"
wasmparser = "0.258.0"
indexmap = "2.6.0"
bincode = { version = "1.3.3", optional = true }
heck = { version = "0.5.0", optional = true }
pyo3 = { version = "0.28.3", features = [
    "abi3-py39",
    "extension-module",
], optional = true }
wasmtime = "50.0.1"
wasmtime-wasi = { version = "50.0.1", features = [ "p3" ], optional = true }
wasm-pkg-client = { version = "0.16.1", optional = true }
once_cell = { version = "1.20.2", optional = true }
component-init-transform = "0.3.1"
async-trait = "0.1.83"
futures = "0.3.31"
tokio = { version = "1.41.0", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "fs",
], optional = true }
bytes = "1.8.0"
pretty_env_logger = { version = "0.5.0", optional = true }
cap-std = { version = "3.3.0", optional = true }
im-rc = { version = "15.1.0", optional = true }
serde = { version = "1.0.213", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.19"
semver = { version = "1.0.23", optional = true }
wit-bindgen-core = { version = "0.61.0", optional = true }
sha2 = "0.10.9"
filetime = "0.2.29"

[dev-dependencies]
assert_cmd = "2.0.16"
flate2 = "1.1.1"
fs_extra = "1.3.0"
hex = "0.4.3"
predicates = "3.1.2"
proptest = "1.5.0"
reqwest = { version = "0.12.15", default-features = false, features = [
    "blocking",
    "brotli",
    "deflate",
    "gzip",
    "zstd",
    "rustls-tls",
] }
tar = "0.4.42"
tempfile = "3.13.0"

[build-dependencies]
anyhow = "1.0.89"
reqwest = { version = "0.12.15", default-features = false, features = [
    "blocking",
    "brotli",
    "deflate",
    "gzip",
    "zstd",
    "rustls-tls",
] }
tar = "0.4.41"
zstd = "0.13.2"
componentize-py-test-generator = { path = "test-generator", version = "0.25.0" }
flate2 = "1.1.1"
hex = "0.4.3"
sha2 = "0.10.9"
wasmparser = "0.258.0"
wasm-encoder = "0.258.0"

[workspace]
package.version = "0.25.0"
package.edition = "2024"
package.license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
package.repository = "https://github.com/bytecodealliance/componentize-py"
members = ["runtime", "test-generator"]

# wit-component 0.258.3 from the golem-2.0 branch of golemcloud/wasm-tools,
# which adds one fix in `src/linking.rs`: the dlopen symbol table counts only
# the symbols it writes, so a library exporting a Wasm tag (such as
# `__c_longjmp`) no longer corrupts the table. Its sibling crates (wasmparser,
# wasm-encoder, wit-parser, ...) still come from crates.io.
[patch.crates-io]
wit-component = { git = "https://github.com/golemcloud/wasm-tools", rev = "801650b5c9e5e4aa32451283f7a6d14100f92889" }
